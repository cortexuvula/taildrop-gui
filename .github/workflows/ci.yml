name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]

# Least privilege by default; no job in this workflow needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    name: Test Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      # Actions are SHA-pinned (tags are mutable). To update, resolve the new
      # tag's commit SHA and replace the pin — do not revert to tag refs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch as of pinning
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        if: matrix.os == 'ubuntu-24.04'
        run: npm test

      - name: Rust formatting check
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Rust clippy
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

      # Debug CI never needs the updater signing key — that key is only for
      # release artifacts. tauri.conf.json enables createUpdaterArtifacts,
      # whose signing step would demand TAURI_SIGNING_PRIVATE_KEY here; the
      # tauri.ci.conf.json override disables updater artifacts for this smoke
      # build (app/dmg/msi/AppImage bundling is still exercised). The release
      # workflow builds with signing enabled.
      - name: Build Tauri (debug)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --debug --config tauri.ci.conf.json
