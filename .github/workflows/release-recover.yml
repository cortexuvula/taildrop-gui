# TailDrop v0.15.1 preservation-only recovery workflow.
# TAILDROP-0151-PRESERVE-R-1569 — dedicated workflow_dispatch to validate
# and publish the existing draft release 434359119 without rebuilding
# assets, moving tags, or altering the original failed run.
#
# Only permitted mutation: updateRelease(draft:false).
# See .github/scripts/release-recover-v0151.json for pinned identities.
#
# IMPORTANT: This workflow uses a shared validation core module.
# All validation logic lives in .github/scripts/release-recover-core.mjs
# and is imported by every github-script step.  Tests exercise the same
# core module; see release-recover.test.mjs.
name: Recover Existing v0.15.1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Enter the exact confirmation string
          publish-existing-v0.15.1-434359119
        required: true

# Default: least privilege.
permissions:
  contents: read

jobs:
  validate-and-publish:
    name: Validate and Publish Existing v0.15.1
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Override: release-touching steps need contents: write, and we
    # need actions: read to inspect the original run's jobs.
    permissions:
      contents: write
      actions: read

    # Prevent concurrent recovery runs — no cancel-in-progress because
    # a competing run must be detected and refused, not silently replaced.
    concurrency:
      group: recover-v0.15.1
      cancel-in-progress: false

    outputs:
      published: ${{ steps.publish.outputs.published }}
      release_url: ${{ steps.publish.outputs.release_url }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # ────────── Phase 1: Identity bindings ──────────────────────────
      - name: Phase 1 — Verify identity (repo, event, ref, confirmation, remote SHA)
        id: identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { checkIdentity } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recover-core.mjs`
            );
            const { readFileSync } = require('node:fs');
            const pin = JSON.parse(readFileSync(
              '${{ github.workspace }}/.github/scripts/release-recover-v0151.json',
              'utf8'
            ));

            const errors = [];

            // Repo
            if (context.repo.owner + '/' + context.repo.repo !== pin.repo) {
              errors.push(`Repository mismatch: ${context.repo.owner}/${context.repo.repo} !== ${pin.repo}`);
            }
            // Event
            if (context.eventName !== 'workflow_dispatch') {
              errors.push(`Event "${context.eventName}" !== "workflow_dispatch"`);
            }
            // Ref
            const ref = process.env.GITHUB_REF || '';
            if (ref !== pin.ref) {
              errors.push(`Ref "${ref}" !== "${pin.ref}"`);
            }
            // Confirmation
            const confirmation = context.payload?.inputs?.confirmation || '';
            if (confirmation !== pin.confirmation) {
              errors.push('Confirmation input does not match the fixed string');
            }
            // Executing SHA
            const sha = process.env.GITHUB_SHA || '';
            if (sha === '') {
              errors.push('GITHUB_SHA is empty');
            }

            // Fetch remote master HEAD and verify it matches the executing SHA.
            let remoteSha = '';
            try {
              const { data: refData } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/master',
              });
              remoteSha = refData.object.sha;
            } catch (e) {
              errors.push(`Failed to fetch remote master ref: ${e.message}`);
            }

            // Use checkIdentity from the shared core module to verify all
            // identity bindings including remoteSha.
            const coreErrors = checkIdentity({
              repo: pin.repo,
              event: 'workflow_dispatch',
              ref: pin.ref,
              confirmation: pin.confirmation,
              execSha: sha,
              remoteSha: remoteSha,
            }, pin);
            errors.push(...coreErrors);

            if (errors.length > 0) {
              for (const err of errors) core.setFailed(err);
              return;
            }
            core.info(`Identity OK: ${pin.repo} @ ${sha} (remote master: ${remoteSha})`);

            // Persist pin as a step output for subsequent steps.
            core.setOutput('pin', JSON.stringify(pin));
            core.setOutput('sha', sha);
            core.setOutput('remote_sha', remoteSha);

      # ────────── Phase 2: Tag binding ────────────────────────────────
      - name: Phase 2 — Verify tag v0.15.1 object and peeled commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PIN: ${{ steps.identity.outputs.pin }}
        with:
          script: |
            const { checkTagBinding } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recover-core.mjs`
            );
            const pin = JSON.parse(process.env.PIN);

            // Fetch the tag via the Git API (not the Releases API) so we
            // can verify the annotated object SHA independently.
            let tag;
            try {
              const { data } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/' + pin.tagName,
              });
              tag = data;
            } catch (e) {
              core.setFailed(`Failed to fetch tag ref: ${e.message}`);
              return;
            }

            // Fetch the annotated tag object to verify it peels to the
            // expected commit.
            let tagObj;
            try {
              const { data } = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tag.object.sha,
              });
              tagObj = data;
            } catch (e) {
              core.setFailed(`Failed to fetch tag object: ${e.message}`);
              return;
            }

            // Delegate to shared core module.
            const errors = checkTagBinding({
              tagObjectSha: tag.object.sha,
              peeledSha: tagObj.object.sha,
            }, pin);

            if (errors.length > 0) {
              for (const err of errors) core.setFailed(err);
              return;
            }

            core.info(`Tag ${pin.tagName} OK: object ${pin.tagObjectSha} → commit ${pin.peeledSha}`);

      # ────────── Phase 3: Original run verification ──────────────────
      - name: Phase 3 — Verify original Release run 41897833512 metadata and jobs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PIN: ${{ steps.identity.outputs.pin }}
        with:
          script: |
            const { checkOriginalRun } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recover-core.mjs`
            );
            const pin = JSON.parse(process.env.PIN);

            // Fetch the full workflow run metadata to verify attempt and head SHA.
            let runMeta;
            try {
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: pin.originalRunId,
              });
              runMeta = data;
            } catch (e) {
              core.setFailed(`Failed to fetch original run #${pin.originalRunId}: ${e.message}`);
              return;
            }

            // Verify attempt and head SHA match pins.
            if (runMeta.run_attempt !== pin.originalRunAttempt) {
              core.setFailed(
                `Original run attempt ${runMeta.run_attempt} !== ${pin.originalRunAttempt}`
              );
              return;
            }
            if (runMeta.head_sha !== pin.originalHeadSha) {
              core.setFailed(
                `Original run head SHA "${runMeta.head_sha}" !== "${pin.originalHeadSha}"`
              );
              return;
            }

            // List all jobs for this run (paginated).
            let allJobs = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: pin.originalRunId,
                per_page: 100,
                page,
              });
              allJobs.push(...data.jobs);
              if (data.jobs.length < 100) break;
            }

            // Delegate to shared core module.
            const errors = checkOriginalRun({
              runId: pin.originalRunId,
              attempt: pin.originalRunAttempt,
              headSha: pin.originalHeadSha,
              jobs: allJobs.map(j => ({ name: j.name, conclusion: j.conclusion })),
            }, pin);

            if (errors.length > 0) {
              for (const err of errors) core.setFailed(err);
              return;
            }

            core.info(
              `Original run #${pin.originalRunId} attempt ${pin.originalRunAttempt}: ` +
              `head ${pin.originalHeadSha}, all ${pin.requiredOriginalJobs.length} required jobs successful`
            );

      # ────────── Phase 4: Draft release identity ─────────────────────
      - name: Phase 4 — Verify draft release 434359119
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PIN: ${{ steps.identity.outputs.pin }}
        with:
          script: |
            const { checkDraftRelease } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recover-core.mjs`
            );
            const pin = JSON.parse(process.env.PIN);

            let release;
            try {
              // Use pinned release ID (not by-tag) because draft releases
              // are not returned by the by-tag endpoint.
              const { data } = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: pin.releaseId,
              });
              release = data;
            } catch (e) {
              core.setFailed(`Failed to get release by ID ${pin.releaseId}: ${e.message}`);
              return;
            }

            // Delegate to shared core module.
            const errors = checkDraftRelease({
              id: release.id,
              tagName: release.tag_name,
              draft: release.draft,
              publishedAt: release.published_at,
              prerelease: release.prerelease,
              targetCommitish: release.target_commitish,
            }, pin);

            if (errors.length > 0) {
              for (const err of errors) core.setFailed(err);
              return;
            }

            core.info(
              `Release ${release.id} "${pin.tagName}" OK: draft=true, prerelease=false, published_at=null`
            );
            core.setOutput('release_id', String(release.id));

      # ────────── Phase 5: Enumerate and verify 14 assets ─────────────
      - name: Phase 5 — Verify exact 14 asset identities
        id: assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PIN: ${{ steps.identity.outputs.pin }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        with:
          script: |
            const { checkAssetSet } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recover-core.mjs`
            );
            const pin = JSON.parse(process.env.PIN);
            const releaseId = Number(process.env.RELEASE_ID);

            // Paginate all assets.
            const assets = [];
            for (let page = 1; ; page++) {
              const res = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                per_page: 100,
                page,
              });
              assets.push(...res.data);
              if (res.data.length < 100) break;
            }

            // Delegate to shared core module.
            const errors = checkAssetSet(
              assets.map(a => ({ id: a.id, name: a.name, size: a.size, digest: a.digest || '' })),
              pin
            );

            if (errors.length > 0) {
              for (const err of errors) core.setFailed(err);
              return;
            }

            core.info(`All ${assets.length} assets verified against pin — id, name, size, digest OK`);
            // Write asset names and download URLs for the next step.
            core.setOutput('asset_names', JSON.stringify(assets.map((a) => a.name)));
            core.setOutput('asset_list', JSON.stringify(assets.map((a) => ({
              id: a.id,
              name: a.name,
              url: a.url,
              browser_download_url: a.browser_download_url,
              size: a.size,
            }))));

      # ────────── Phase 6: Download and hash all assets ───────────────
      - name: Phase 6 — Download and hash 14 asset bytes
        id: download
        shell: bash
        env:
          ASSETS_JSON: ${{ steps.assets.outputs.asset_list }}
          PIN: ${{ steps.identity.outputs.pin }}
          # gh needs GH_TOKEN explicitly mapped for shell steps; github-script
          # steps get the token injected via octokit, but raw bash does not inherit it.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-assets

          # Parse asset list from step output.
          ASSETS='${{ steps.assets.outputs.asset_list }}'
          if [ -z "$ASSETS" ] || [ "$ASSETS" = "[]" ]; then
            echo "::error::Asset list is empty"
            exit 1
          fi

          # Download each asset via the GitHub API with the correct
          # Accept header for binary content.  We use gh api instead
          # of the browser_download_url because draft releases are
          # behind an untagged URL that requires authentication.
          echo "$ASSETS" | node -e "
            const assets = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8').trim());
            for (const a of assets) {
              console.log(a.id + '|' + a.name);
            }
          " | while IFS='|' read -r id name; do
            echo "Downloading ${name} (id=${id})..."
            gh api \
              --header 'Accept: application/octet-stream' \
              "/repos/${{ github.repository }}/releases/assets/${id}" \
              > "/tmp/recovery-assets/${name}" 2>/dev/null
            actual_size=$(stat -f %z "/tmp/recovery-assets/${name}" 2>/dev/null || stat -c %s "/tmp/recovery-assets/${name}" 2>/dev/null)
            echo "Downloaded ${name}: ${actual_size} bytes"
          done

          # Hash every asset and verify against pins.
          cd /tmp/recovery-assets
          node --input-type=module -e "
            import { createHash } from 'node:crypto';
            import { readFileSync } from 'node:fs';
            const pin = JSON.parse(process.env.PIN);
            const errors = [];
            for (const exp of pin.assets) {
              const path = '/tmp/recovery-assets/' + exp.name;
              let bytes;
              try {
                bytes = readFileSync(path);
              } catch (e) {
                errors.push('Cannot read downloaded asset \"' + exp.name + '\": ' + e.message);
                continue;
              }
              if (bytes.length !== exp.size) {
                errors.push('Asset \"' + exp.name + '\": downloaded size ' + bytes.length + ' !== expected ' + exp.size);
              }
              const hash = createHash('sha256');
              hash.update(bytes);
              const actual = 'sha256:' + hash.digest('hex');
              if (actual !== exp.digest) {
                errors.push('Asset \"' + exp.name + '\": digest \"' + actual + '\" !== \"' + exp.digest + '\"');
              }
            }
            if (errors.length > 0) {
              for (const err of errors) console.log('FAIL: ' + err);
              process.exit(1);
            }
            console.log('All ' + pin.assets.length + ' assets verified: size and SHA-256 match');
          "
          echo "download_ok=true" >> $GITHUB_OUTPUT

      # ────────── Phase 7: Run unchanged validator ────────────────────
      - name: Phase 7 — Run unchanged validate-updater-manifest
        shell: bash
        env:
          ASSET_NAMES: ${{ steps.assets.outputs.asset_names }}
        run: |
          set -euo pipefail

          # Copy latest.json from the downloaded assets.
          cp /tmp/recovery-assets/latest.json /tmp/recovery-latest.json

          # Write asset names for the validator.
          echo '${{ steps.assets.outputs.asset_names }}' > /tmp/recovery-asset-names.json

          # Run the EXISTING validator (unchanged).
          node .github/scripts/validate-updater-manifest.mjs \
            --manifest /tmp/recovery-latest.json \
            --version v0.15.1 \
            --assets /tmp/recovery-asset-names.json

      # ────────── Phase 8: Competing run check ────────────────────────
      - name: Phase 8 — Check for active competing runs (fail-closed)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { checkCompetitor } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recover-core.mjs`
            );

            // List active workflow runs IN THIS WORKFLOW, excluding this run.
            // Use workflow-specific endpoint to narrow scope.
            //
            // GitHub's listWorkflowRuns API accepts the workflow FILENAME
            // (e.g. "release-recover.yml") or numeric ID, NOT the display
            // name.  The display name "Recover Existing v0.15.1" returns
            // HTTP 404.
            const thisRunId = context.runId;
            let activeRuns = [];
            try {
              // Fetch runs for this specific workflow (release-recover.yml) and
              // for the parent release workflow (release.yml) — both could
              // interfere with publication.
              for (const workflowName of ['release-recover.yml', 'release.yml']) {
                for (let page = 1; ; page++) {
                  const { data } = await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: workflowName,
                    per_page: 50,
                    page,
                  });
                  activeRuns.push(...data.workflow_runs.map(r => ({
                    id: r.id,
                    status: r.status,
                    name: r.name || r.display_title || `#${r.id}`,
                  })));
                  if (data.workflow_runs.length < 50) break;
                }
              }
            } catch (e) {
              core.setFailed(`Failed to list active runs: ${e.message}`);
              return;
            }

            // Exclude self from competitor check.
            const others = activeRuns.filter(r => r.id !== thisRunId);

            // Delegate to shared core module.
            const errors = checkCompetitor(others, {});

            if (errors.length > 0) {
              for (const err of errors) core.setFailed(err);
              return;
            }

            core.info('No competing publication or recovery runs detected');

      # ────────── Phase 9: Final TOCTOU recheck ───────────────────────
      - name: Phase 9 — Final recheck before publish (identity, tag, assets, competitors)
        id: final-recheck
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PIN: ${{ steps.identity.outputs.pin }}
        with:
          script: |
            const { checkFinalRecheck, checkCompetitor } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recover-core.mjs`
            );
            const pin = JSON.parse(process.env.PIN);

            const errors = [];

            // Re-fetch release.
            let release;
            try {
              // Use pinned release ID (not by-tag) because draft releases
              // are not returned by the by-tag endpoint.
              const { data } = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: pin.releaseId,
              });
              release = data;
            } catch (e) {
              errors.push(`Final recheck: could not fetch release: ${e.message}`);
            }

            // Re-fetch tag.
            let tagRef, tagObj;
            try {
              const { data: refData } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/' + pin.tagName,
              });
              tagRef = refData;
              const { data: objData } = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tagRef.object.sha,
              });
              tagObj = objData;
            } catch (e) {
              errors.push(`Final recheck: could not fetch tag: ${e.message}`);
            }

            // Re-fetch assets.
            const assets = [];
            if (release) {
              for (let page = 1; ; page++) {
                const res = await github.rest.repos.listReleaseAssets({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  per_page: 100,
                  page,
                });
                assets.push(...res.data);
                if (res.data.length < 100) break;
              }
            }

            // Re-check competitors.
            // Use workflow filenames (not display names) as workflow_id.
            const thisRunId = context.runId;
            let activeRuns = [];
            try {
              for (const wf of ['release-recover.yml', 'release.yml']) {
                for (let page = 1; ; page++) {
                  const { data } = await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: wf,
                    per_page: 50,
                    page,
                  });
                  activeRuns.push(...data.workflow_runs.map(r => ({
                    id: r.id,
                    status: r.status,
                    name: r.name || r.display_title || `#${r.id}`,
                  })));
                  if (data.workflow_runs.length < 50) break;
                }
              }
            } catch (e) {
              errors.push(`Final recheck: could not check competitors: ${e.message}`);
            }
            const others = activeRuns.filter(r => r.id !== thisRunId);
            errors.push(...checkCompetitor(others, {}).map(m => `Final recheck: ${m}`));

            // Delegate to shared core module for release/tag/asset drift detection.
            if (release && tagRef && tagObj) {
              const coreErrors = checkFinalRecheck({
                release: {
                  id: release.id,
                  tagName: release.tag_name,
                  draft: release.draft,
                  publishedAt: release.published_at,
                  prerelease: release.prerelease,
                  targetCommitish: release.target_commitish,
                },
                assets: assets.map(a => ({
                  id: a.id, name: a.name, size: a.size, digest: a.digest || '',
                })),
                tag: {
                  tagObjectSha: tagRef.object.sha,
                  peeledSha: tagObj.object.sha,
                },
              }, pin);
              errors.push(...coreErrors);
            }

            if (errors.length > 0) {
              for (const err of errors) core.setFailed(err);
              return;
            }

            core.info('Final recheck OK: release still draft, tag unchanged, all 14 assets unchanged, no competitors');

      # ────────── Phase 10: Publish ───────────────────────────────────
      - name: Phase 10 — Publish existing draft (draft:false)
        id: publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PIN: ${{ steps.identity.outputs.pin }}
        with:
          script: |
            const pin = JSON.parse(process.env.PIN);

            core.info(`Publishing release ${pin.releaseId} (draft → published)...`);

            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: pin.releaseId,
              draft: false,
            });

            core.info(`Published: ${data.html_url}`);
            core.setOutput('published', 'true');
            core.setOutput('release_url', data.html_url);
            core.setOutput('release_id', String(data.id));

      # ────────── Phase 11: Readback verification ─────────────────────
      - name: Phase 11 — Readback published release and verify (full identity, assets, tag)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PIN: ${{ steps.identity.outputs.pin }}
          RELEASE_ID: ${{ steps.publish.outputs.release_id }}
        with:
          script: |
            const { checkPublishedRelease, checkAssetSet, checkTagBinding } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recover-core.mjs`
            );
            const pin = JSON.parse(process.env.PIN);
            const releaseId = Number(process.env.RELEASE_ID);

            core.info('Reading back published release...');

            // Fetch release by ID.
            let release;
            try {
              const { data } = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
              });
              release = data;
            } catch (e) {
              core.setFailed(`Readback: could not fetch release: ${e.message}`);
              return;
            }

            // Fetch tag for readback verification.
            let tagRef, tagObj;
            try {
              const { data: refData } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/' + pin.tagName,
              });
              tagRef = refData;
              const { data: objData } = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tagRef.object.sha,
              });
              tagObj = objData;
            } catch (e) {
              core.setFailed(`Readback: could not fetch tag: ${e.message}`);
              return;
            }

            // Re-fetch assets.
            const assets = [];
            for (let page = 1; ; page++) {
              const res = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                per_page: 100,
                page,
              });
              assets.push(...res.data);
              if (res.data.length < 100) break;
            }

            const errors = [];

            // Verify PUBLISHED (not draft) using checkPublishedRelease.
            // This positively requires draft===false, non-null published_at,
            // expected id/tag/prerelease/URL — no string-message suppression.
            errors.push(...checkPublishedRelease({
              id: release.id,
              tagName: release.tag_name,
              draft: release.draft,
              publishedAt: release.published_at,
              prerelease: release.prerelease,
              html_url: release.html_url,
            }, pin));

            // Verify tag unchanged using core module.
            const tagErrors = checkTagBinding({
              tagObjectSha: tagRef.object.sha,
              peeledSha: tagObj.object.sha,
            }, pin);
            errors.push(...tagErrors.map(m => `Readback: ${m}`));

            // Verify full asset identities (name, size, digest) using core module.
            const assetErrors = checkAssetSet(
              assets.map(a => ({ id: a.id, name: a.name, size: a.size, digest: a.digest || '' })),
              pin
            );
            errors.push(...assetErrors.map(m => `Readback: ${m}`));

            if (errors.length > 0) {
              for (const err of errors) core.setFailed(err);
              return;
            }

            core.info(
              `✓ Published: ${release.html_url}`
            );
            core.info(`✓ Release ${release.id}: published_at=${release.published_at}, draft=${release.draft}`);
            core.info(`✓ All ${assets.length} assets unchanged (id, name, size, digest verified)`);
            core.info(`✓ Tag ${pin.tagName} unchanged (object ${pin.tagObjectSha} → commit ${pin.peeledSha})`);
            core.info(`✓ Original run #${pin.originalRunId} remains failed (expected)`);
            core.setOutput('readback_ok', 'true');