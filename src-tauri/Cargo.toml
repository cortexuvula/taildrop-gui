[package]
name = "taildrop-gui"
version = "0.16.0"
description = "TailDrop — drag-and-drop file transfer for Tailscale"
authors = ["you"]
edition = "2021"

[lib]
name = "taildrop_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "time", "rt", "macros", "sync"] }
# "sync" provides the broadcast channel used by the TD-05 receipt store.
# Do not remove without replacing the receipt emitter transport.
tokio-util = "0.7"
dirs = "6"
log = "0.4"
env_logger = "0.11"
# Browser (M1): pure-SFTP transport over Tailscale SSH. Versions pinned to the
# exact pair proven by the M0 fleet spike (m0-spike/Cargo.lock).
russh = { version = "=0.65.2", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.1"
async-trait = "0.1"
# Random 64-bit staging tags (.tailfiles-incoming-<16hex>).
rand = "0.9"
# Local delete is Trash-only, never permanent (safety invariant 11).
trash = "5"
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
# Handle-bound local sink: openat/renameat2/renameatx_np, O_NOFOLLOW, dev/ino.
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
hyperlocal = "0.9"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
